<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="ZEKiQ Admin">
  <!--
    نفس بلاطة البرنامج — لون بارد (نيلي/سماوي) يميّز الإدارة عن ذهب الكاشير.
    الترتيب: وجه آلي فوق · حرف Z تحت.
  -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="45%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="z" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="35%" stop-color="#67E8F9"/>
      <stop offset="70%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CFFAFE"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="eye" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="zGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="eyeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect x="6" y="6" width="244" height="244" rx="52" fill="none" stroke="url(#ring)" stroke-width="5"/>
  <rect x="14" y="14" width="228" height="100" rx="40" fill="url(#shine)"/>

  <!-- Robot face — top -->
  <g transform="translate(128 92)">
    <line x1="0" y1="-58" x2="0" y2="-44" stroke="url(#metal)" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="-62" r="5" fill="url(#eye)" filter="url(#eyeGlow)"/>

    <rect x="-56" y="-42" width="112" height="84" rx="26" fill="url(#face)" stroke="url(#metal)" stroke-width="3.5"/>
    <rect x="-38" y="-30" width="76" height="11" rx="5.5" fill="#22D3EE" opacity="0.16"/>

    <g filter="url(#eyeGlow)">
      <rect x="-32" y="-10" width="26" height="16" rx="8" fill="#070a14" stroke="url(#metal)" stroke-width="2"/>
      <rect x="6" y="-10" width="26" height="16" rx="8" fill="#070a14" stroke="url(#metal)" stroke-width="2"/>
      <circle cx="-19" cy="-2" r="4.5" fill="url(#eye)"/>
      <circle cx="19" cy="-2" r="4.5" fill="url(#eye)"/>
    </g>

    <rect x="-20" y="18" width="40" height="7" rx="3.5" fill="#070a14" stroke="url(#metal)" stroke-width="1.75"/>
    <rect x="-11" y="20" width="22" height="3" rx="1.5" fill="#67E8F9" opacity="0.9"/>

    <g stroke="#22D3EE" stroke-width="2" stroke-linecap="round" opacity="0.45">
      <line x1="-46" y1="0" x2="-40" y2="0"/>
      <line x1="-46" y1="8" x2="-40" y2="8"/>
      <line x1="40" y1="0" x2="46" y2="0"/>
      <line x1="40" y1="8" x2="46" y2="8"/>
    </g>
  </g>

  <!-- Brand Z — bottom -->
  <path fill="url(#z)" filter="url(#zGlow)" d="M52 168h152L84 214h120v26H52l84-46H52V168z"/>
  <circle cx="188" cy="166" r="9" fill="#A5F3FC"/>
  <circle cx="188" cy="166" r="5" fill="#22D3EE"/>
</svg>
