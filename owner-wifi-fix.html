<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ZEKiQ — استعادة WiFi</title>
  <style>
    body{margin:0;font-family:system-ui,sans-serif;background:#f3ebe0;color:#2a2418;padding:20px 16px}
    h1{font-size:1.1rem;color:#166534}
    p{font-size:.9rem;line-height:1.7;color:#57534e}
    label{display:block;font-size:12px;font-weight:700;margin:10px 0 4px}
    input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #d8c6a0;font-size:16px}
    button{width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:800;margin-top:12px;background:#166534;color:#fff}
    .ok{margin-top:14px;padding:12px;border-radius:12px;background:#dcfce7;color:#166534;display:none}
  </style>
</head>
<body>
  <h1>🔧 استعادة اتصال WiFi / كابل</h1>
  <p>إذا انقطع الواي فاي في التطبيق فقط (والشبكة تعمل في المحل)، اضغط الزر أدناه ثم أعد فتح <b>ZEKiQ Manager</b>.</p>
  <label>IP الكاشير</label>
  <input id="lan" dir="ltr" value="192.168.1.25:3000" />
  <button type="button" id="fix">استعادة WiFi الآن</button>
  <div class="ok" id="ok">✓ تم — أغلق هذه الصفحة وافتح التطبيق → حفظ + WiFi إن لزم</div>
  <script>
    document.getElementById("fix").onclick = function () {
      var lan = document.getElementById("lan").value.trim();
      if (!lan) return;
      if (!/^https?:\/\//i.test(lan)) lan = "http://" + lan;
      try {
        localStorage.setItem("tonino-owner-link-mode", "wifi");
        localStorage.setItem("tonino-owner-working-via", "lan");
        localStorage.setItem("tonino-owner-server", lan);
        localStorage.setItem("tonino-owner-working-api", lan);
        localStorage.setItem("tonino-owner-active-api", lan);
        localStorage.setItem("tonino-owner-manual-target", "1");
        localStorage.setItem("tonino-owner-server-profiles", JSON.stringify([{
          id: "cashier", label: "Shop", server: lan, savedAt: Date.now()
        }]));
        var host = lan.replace(/^https?:\/\//, "").split(":")[0];
        localStorage.setItem("tonino-owner-remote-for-ip", host);
        localStorage.removeItem("tonino-owner-network-locked");
        localStorage.removeItem("tonino-owner-locked-host");
        document.getElementById("ok").style.display = "block";
      } catch (e) {
        alert("افتح هذه الصفحة من نفس متصفح التطبيق أو استخدم زر استعادة WiFi داخل التطبيق");
      }
    };
  </script>
</body>
</html>
