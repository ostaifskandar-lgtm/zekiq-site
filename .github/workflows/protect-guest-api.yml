name: Protect guest-api shops

on:
  push:
    branches: [main]
    paths:
      - guest-api.json
      - guest-api-protected-shops.json

permissions:
  contents: write

jobs:
  merge-shops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Merge protected shops into guest-api.json
        run: node scripts/merge-guest-api-shops.mjs
      - name: Commit merge if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add guest-api.json
          if git diff --staged --quiet; then
            echo "No merge changes needed"
          else
            git commit -m "protect guest-api.json shops (auto-merge Tonino)"
            git push
          fi
