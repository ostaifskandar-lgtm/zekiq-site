<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>المينو الرقمي — ZEKiQ</title>
  <script>
    (function () {
      var params = new URLSearchParams(location.search || "");
      params.set("view", "menu");
      var hash = location.hash.replace(/^#\??/, "").trim();
      if (hash && hash.indexOf("=") >= 0) {
        new URLSearchParams(hash).forEach(function (v, k) { params.set(k, v); });
      }
      location.replace("../table/index.html?" + params.toString());
    })();
  </script>
</head>
<body style="margin:0;background:#0e0a02;color:#f5d878;font-family:system-ui;text-align:center;padding:48px 24px">

</body>
</html>
