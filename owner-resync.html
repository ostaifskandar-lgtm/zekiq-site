<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ZEKiQ — مزامنة مع التابلت القديم</title>
  <style>
    body{margin:0;font-family:system-ui,sans-serif;background:#ecfdf5;color:#1a1714;padding:20px 16px 40px}
    h1{font-size:1.2rem;color:#166534;text-align:center}
    p{font-size:.9rem;line-height:1.7;color:#44403c;text-align:center}
    button{display:block;width:100%;padding:16px;border:none;border-radius:14px;font-size:1rem;font-weight:800;margin:14px 0;background:linear-gradient(135deg,#166534,#22c55e);color:#fff}
    .ok{display:none;padding:14px;border-radius:12px;background:#dcfce7;color:#166534;font-size:.88rem;line-height:1.7}
    code{font-family:ui-monospace,monospace;background:#f5efe3;padding:2px 6px;border-radius:6px}
  </style>
</head>
<body>
  <h1>🔄 مزامنة مع التابلت القديم</h1>
  <p>يصلح اختلاف الطاولات — يجبر الاتصال على نفس الكاشير<br><code dir="ltr">192.168.1.25:3000</code></p>
  <button type="button" id="go">إصلاح الآن + إعادة الدخول</button>
  <div class="ok" id="ok">
    ✓ تم!<br>
    1. أغلق ZEKiQ Manager بالكامل<br>
    2. افتحه من جديد<br>
    3. أدخل <b>PIN المالك</b> مرة أخرى<br>
    الطاولات ستطابق التابلت القديم
  </div>
  <script>
    var LAN = "http://192.168.1.25:3000";
    fetch("owner-config.json", { cache: "no-store" })
      .then(function (r) { return r.ok ? r.json() : {}; })
      .then(function (c) { if (c.lanUrl) LAN = c.lanUrl.replace(/\/+$/, ""); })
      .catch(function () {});

    document.getElementById("go").onclick = function () {
      var host = LAN.replace(/^https?:\/\//, "").split(":")[0];
      try {
        localStorage.removeItem("tonino-owner-session-token");
        localStorage.setItem("tonino-owner-lan-lock", "1");
        localStorage.setItem("tonino-owner-tablet-clone", "1");
        localStorage.setItem("tonino-owner-link-mode", "wifi");
        localStorage.setItem("tonino-owner-working-via", "lan");
        localStorage.setItem("tonino-owner-manual-target", "1");
        localStorage.setItem("tonino-owner-server", LAN);
        localStorage.setItem("tonino-owner-working-api", LAN);
        localStorage.setItem("tonino-owner-active-api", LAN);
        localStorage.setItem("tonino-owner-remote-base", "https://tonino.zekiqmenu.com");
        localStorage.setItem("tonino-owner-remote-for-ip", host);
        localStorage.setItem("tonino-owner-server-profiles", JSON.stringify([{
          id: "cashier", label: "Tonino", server: LAN, savedAt: Date.now()
        }]));
        localStorage.setItem("tonino-owner-native-apk", "1");
        localStorage.setItem("zekiq-manager-native", "1");
        document.getElementById("ok").style.display = "block";
      } catch (e) {
        alert("افتح هذه الصفحة من متصفح الجهاز");
      }
    };
  </script>
</body>
</html>
